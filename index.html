<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>João Renato Neto | links</title>
  <meta name="description" content="Meus links: TikTok, Instagram, LinkedIn, GitHub e o TechRumo.">
  <meta name="theme-color" content="#0d1117">

  <!-- Ícones (Tabler Icons) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

  <style>
    /* ---------- Cores (mude aqui e o site inteiro muda) ---------- */
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-strong: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --green-bg: #0f1a14;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      display: flex;
      justify-content: center;
      padding: 32px 16px 48px;
    }

    .page {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* ---------- Topo: bolinhas de janela ---------- */
    .dots { display: flex; gap: 6px; align-self: flex-start; margin-bottom: 8px; }
    .dots span { width: 10px; height: 10px; border-radius: 50%; }
    .dots span:nth-child(1) { background: #f85149; }
    .dots span:nth-child(2) { background: #d29922; }
    .dots span:nth-child(3) { background: var(--green); }

    /* ---------- Perfil ---------- */
    .avatar {
      width: 84px; height: 84px;
      border: 1px solid var(--green);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: var(--green);
      font-size: 26px;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    h1 { font-size: 18px; font-weight: 500; color: var(--text-strong); margin-top: 4px; }
    .bio { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 10px; }

    /* ---------- Links ---------- */
    .link {
      width: 100%;
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      transition: border-color .15s, transform .15s;
    }
    .link .prompt { color: var(--green); }
    .link i { font-size: 20px; }
    .link .arrow { margin-left: auto; color: var(--muted); }
    .link:hover, .link:focus-visible {
      border-color: var(--green);
      transform: translateY(-2px);
      outline: none;
    }

    /* ---------- Card TechRumo (destaque) ---------- */
    .featured {
      width: 100%;
      margin-top: 8px;
      padding: 18px 18px 14px;
      background: var(--green-bg);
      border: 1px solid var(--green);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      display: block;
      transition: transform .15s;
    }
    .featured:hover, .featured:focus-visible { transform: translateY(-2px); outline: none; }
    .featured .tag { font-size: 12px; color: var(--green); margin-bottom: 10px; }
    .featured .title {
      display: flex; align-items: center; gap: 10px;
      font-size: 19px; font-weight: 500; color: var(--text-strong);
    }
    .featured .title i { font-size: 24px; color: var(--green); }
    .featured .question { font-size: 14px; color: var(--text-strong); margin-top: 10px; line-height: 1.55; }
    .featured .promise { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.55; }
    .featured .footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px; padding-top: 12px;
      border-top: 1px dashed var(--border);
      font-size: 13px;
    }
    .featured .soon { color: var(--green); }
    .featured .notify { color: var(--muted); }

    /* Cursor piscando */
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
      .link, .featured { transition: none; }
    }

    footer { margin-top: 16px; font-size: 12px; color: var(--muted); }
  </style>
</head>

<body>
  <main class="page">

    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>

    <!-- Para usar foto: troque "JN" por <img src="foto.jpg" alt="Foto de João Renato Neto"> -->
    <div class="avatar" aria-hidden="true">JN</div>
    <h1>~/netoodev</h1>
    <p class="bio">dev e criador de conteúdo tech</p>

    <a class="link" href="https://www.tiktok.com/@netoodev" target="_blank" rel="noopener noreferrer">
      <span class="prompt">&gt;</span><i class="ti ti-brand-tiktok" aria-hidden="true"></i>tiktok<span class="arrow">↗</span>
    </a>

    <a class="link" href="https://www.instagram.com/neto_odev" target="_blank" rel="noopener noreferrer">
      <span class="prompt">&gt;</span><i class="ti ti-brand-instagram" aria-hidden="true"></i>instagram<span class="arrow">↗</span>
    </a>

    <a class="link" href="https://www.linkedin.com/in/jo%C3%A3o-renato-neto-85a8522a0/" target="_blank" rel="noopener noreferrer">
      <span class="prompt">&gt;</span><i class="ti ti-brand-linkedin" aria-hidden="true"></i>linkedin<span class="arrow">↗</span>
    </a>

    <a class="link" href="https://github.com/joaonetttto" target="_blank" rel="noopener noreferrer">
      <span class="prompt">&gt;</span><i class="ti ti-brand-github" aria-hidden="true"></i>github<span class="arrow">↗</span>
    </a>

    <!-- TechRumo: troque o href="#" pelo link do formulário/site quando tiver -->
    <a class="featured" href="#" aria-label="TechRumo, em breve">
      <div class="tag">// novo projeto</div>
      <div class="title"><i class="ti ti-rocket" aria-hidden="true"></i>techrumo</div>
      <p class="question">Quer entrar na área de tecnologia, mas não sabe por onde começar?</p>
      <p class="promise">Receba um roadmap feito sob medida pra você.</p>
      <div class="footer">
        <span class="soon">$ ./em-breve<span class="cursor">_</span></span>
        <span class="notify">avise-me ↗</span>
      </div>
    </a>

    <footer>© 2026 João Renato Neto</footer>
  </main>
</body>
</html>
